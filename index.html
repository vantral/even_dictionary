<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Эвенский словарь</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <main class="page">
    <header class="header"><h1>Эвенский словарь</h1></header>
    <section class="search-panel" aria-label="Поиск по словарю">
      <form id="search-form" role="search">
        <label class="sr-only" for="search">Поисковый запрос</label>
        <div class="search-row">
          <input id="search" type="search" placeholder="Введите слово или перевод" autocomplete="off" autofocus>
          <button class="submit" type="submit">Найти</button>
        </div>
        <div id="virtual-keyboard" class="keyboard" aria-label="Специальные эвенские символы">
          <span>Спецсимволы:</span>
          <button type="button" data-letter="ӈ">ӈ</button>
          <button type="button" data-letter="ө">ө</button>
          <button type="button" data-letter="ӫ">ӫ</button>
        </div>
        <fieldset class="modes">
          <legend>Режим:</legend>
          <label><input type="checkbox" name="mode" value="translation"> По переводу</label>
          <label><input type="checkbox" name="mode" value="regex"> Регулярное выражение</label>
        </fieldset>
        <p id="mode-hint" class="hint">Обычный поиск по эвенскому заголовку с учётом диалектных вариантов.</p>
      </form>
    </section>
    <div class="result-heading"><p id="status" class="status" aria-live="polite"></p></div>
    <section id="result" class="results" aria-label="Результаты поиска"></section>
  </main>
  <script src="./assets/dict.js"></script>
  <script src="./assets/search-core.js"></script>
  <script src="./assets/script.js"></script>
</body>
</html>
